global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/reglas.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # El DNS de Docker devuelve una dirección por cada caja de la API,
  # así que Prometheus las lee todas, también durante un despliegue.
  - job_name: api
    metrics_path: /metricas
    dns_sd_configs:
      - names: ["api"]
        type: A
        port: 3000

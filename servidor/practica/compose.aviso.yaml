# En el servidor de práctica, un receptor de prueba hace de Telegram.
# Se suma después de monitoreo/compose.yaml.
services:
  # Escribe en su bitácora cada aviso que recibe.
  receptor:
    image: mendhak/http-https-echo:42@sha256:a265f55c86cb3baead76fdf379dc8e9e6440ed121874e101e60b833e05bce8d4
    networks:
      - monitoreo

  alertmanager:
    volumes: !override
      - ./servidor/practica/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - datos-alertmanager:/alertmanager
    secrets: !reset []

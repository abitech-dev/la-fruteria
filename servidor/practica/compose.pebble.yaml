# Pebble hace de Let's Encrypt en el servidor de práctica.
# Se suma después de compose.yaml y compose.produccion.yaml.
services:
  pebble:
    image: ghcr.io/letsencrypt/pebble:2.10.1@sha256:ddf230642b1a584f519f32e347de1b05a6e4c1f6c35c1863b33effeab5f78199
    command: ["-config", "/config/pebble.json"]
    environment:
      PEBBLE_VA_NOSLEEP: "1"
    ports:
      - "127.0.0.1:15000:15000"
    volumes:
      - ./servidor/practica/pebble.json:/config/pebble.json:ro
      - certs-pebble:/test/certs
    networks:
      - frente

  caddy:
    environment:
      ACME_CA: https://pebble:14000/dir
      # Pebble firma su propia página con una raíz de prueba.
      SSL_CERT_FILE: /pebble/pebble.minica.pem
    volumes:
      - certs-pebble:/pebble:ro
    networks:
      frente:
        # Pebble busca el dominio en la red de Docker y llega a Caddy.
        aliases:
          - ${DOMINIO}
    depends_on:
      pebble:
        condition: service_started

volumes:
  certs-pebble:

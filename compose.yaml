name: la-fruteria

# Por defecto, Docker no rota la bitácora y puede llenar el disco.
# Con este tope, cada caja guarda a lo sumo 3 archivos de 10 MB.
x-bitacora: &bitacora
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Servicios propios sin privilegios y en solo lectura.
x-endurecido: &endurecido
  logging: *bitacora
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped

# Cada servicio avisa cuando de verdad puede atender.
x-salud: &salud
  interval: 10s
  timeout: 3s
  retries: 3
  start_period: 15s
  start_interval: 2s

services:
  web:
    <<: *endurecido
    build: ./web
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - frente
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      <<: *salud
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M
          pids: 100

  api:
    <<: *endurecido
    build: ./api
    environment:
      BD_CLAVE_ARCHIVO: /run/secrets/bd_clave
    secrets:
      - bd_clave
    networks:
      - frente
      - fondo
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Antes de arrancar la API, una caja de paso deja el catálogo en Redis.
    pre_start:
      - command: ["node", "src/calentar-cache.js"]
    healthcheck:
      <<: *salud
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/salud/listo').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
          pids: 100

  despachador:
    <<: *endurecido
    build: ./api
    command: ["node", "src/despachador.js"]
    environment:
      BD_CLAVE_ARCHIVO: /run/secrets/bd_clave
    secrets:
      - bd_clave
    networks:
      - fondo
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      <<: *salud
      test: ["CMD", "node", "-e", "process.exit(Date.now() - require('node:fs').statSync('/tmp/latido').mtimeMs < 30000 ? 0 : 1)"]
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
          pids: 100

  postgres:
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_USER: fruteria
      POSTGRES_PASSWORD_FILE: /run/secrets/bd_clave
    secrets:
      - bd_clave
    volumes:
      - datos-postgres:/var/lib/postgresql
      - ./base-de-datos:/docker-entrypoint-initdb.d:ro
    networks:
      - fondo
    # PostgreSQL escribe sus datos en el volumen y su socket en memoria.
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/postgresql
    security_opt:
      - no-new-privileges:true
    logging: *bitacora
    restart: unless-stopped
    healthcheck:
      <<: *salud
      test: ["CMD", "pg_isready", "-U", "fruteria", "-d", "fruteria"]
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
          pids: 100

  redis:
    image: redis:8-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - datos-redis:/data
    networks:
      - fondo
    read_only: true
    security_opt:
      - no-new-privileges:true
    logging: *bitacora
    restart: unless-stopped
    healthcheck:
      <<: *salud
      test: ["CMD", "redis-cli", "ping"]
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
          pids: 100

  # Una consola de PostgreSQL que solo arranca con --profile herramientas.
  psql:
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    profiles: ["herramientas"]
    environment:
      PGHOST: postgres
      PGUSER: fruteria
      PGDATABASE: fruteria
    networks:
      - fondo
    depends_on:
      postgres:
        condition: service_healthy
    secrets:
      - bd_clave
    # psql no lee su clave de un archivo, así que sh se la pasa al arrancar.
    entrypoint: ["sh", "-c", "PGPASSWORD=\"$$(cat /run/secrets/bd_clave)\" exec psql \"$$@\"", "psql"]

networks:
  frente:
  # Sin salida a internet. De las cajas del frente, solo la API entra aquí.
  fondo:
    internal: true

volumes:
  datos-postgres:
  datos-redis:

secrets:
  bd_clave:
    file: ./secretos/bd_clave.txt

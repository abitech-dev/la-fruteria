# Cada dirección puede crear 10 pedidos por minuto, con ráfagas de 5.
limit_req_zone $binary_remote_addr zone=pedidos:10m rate=10r/m;

server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
    gzip_min_length 1024;

    add_header Content-Security-Policy "default-src 'self'; img-src 'self'; style-src 'self'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # La dirección de la API cambia al recrearla. Con la variable, nginx pregunta
    # su nombre al DNS de Docker cada 10 segundos en lugar de solo al arrancar.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:3000;

    location / {
        try_files $uri $uri/ =404;
    }

    # expires conserva las cabeceras de seguridad; add_header las borraría.
    location /fuentes/ {
        expires 30d;
    }

    location /img/ {
        expires 7d;
    }

    # Los nombres llevan hash, así que se guardan un año.
    location /assets/ {
        expires 1y;
    }

    location = /api/pedidos {
        limit_req zone=pedidos burst=5 nodelay;
        limit_req_status 429;
        proxy_pass $api;
    }

    # Solo la API pública pasa; /metricas y /salud quedan dentro de la red.
    location /api/ {
        proxy_pass $api;
    }
}

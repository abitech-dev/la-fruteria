name: Despliegue a producción

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

# Dos despliegues nunca se pisan. El segundo espera al primero.
concurrency:
  group: produccion
  cancel-in-progress: false

env:
  PREFIJO: ghcr.io/${{ github.repository_owner }}/la-fruteria

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publicar:
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      # La firma sin claves usa la identidad de este flujo.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: bake
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          push: true
          set: |
            web.tags=${{ env.PREFIJO }}-web:${{ github.sha }}
            api.tags=${{ env.PREFIJO }}-api:${{ github.sha }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4
      - name: Firmar las imágenes por su resumen
        env:
          METADATOS: ${{ steps.bake.outputs.metadata }}
        run: |
          for imagen in web api; do
            resumen=$(jq -r --arg i "$imagen" '.[$i]["containerimage.digest"]' <<< "$METADATOS")
            cosign sign --yes "$PREFIJO-$imagen@$resumen"
          done

  desplegar:
    needs: publicar
    # Sin servidor configurado, el flujo publica, firma y se detiene aquí.
    if: vars.SERVIDOR != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    steps:
      - name: Preparar la llave SSH
        env:
          CLAVE_SSH: ${{ secrets.CLAVE_SSH }}
          HUELLA_SSH: ${{ vars.HUELLA_SSH }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$CLAVE_SSH" > ~/.ssh/despliegue
          chmod 600 ~/.ssh/despliegue
          printf '%s\n' "$HUELLA_SSH" > ~/.ssh/known_hosts
      - name: Desplegar en el servidor
        env:
          SERVIDOR: ${{ vars.SERVIDOR }}
          VERSION: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/despliegue "$SERVIDOR" bash -s -- "$VERSION" <<'FIN'
          set -e
          cd la-fruteria
          git fetch -q origin
          git checkout -q --detach "$1"
          sed -i "s/^VERSION=.*/VERSION=$1/" .env
          sudo docker compose pull -q
          sudo docker compose up -d --wait
          FIN
